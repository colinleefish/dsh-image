name: Publish image

on:
  workflow_dispatch:
  push:
    tags:
      - "image-v*"

permissions:
  contents: read
  packages: write

env:
  DSH_VERSION: 0.2.2-rc.1
  IMAGE_VERSION: 0.2.2-rc.1-r2
  PNPM_VERSION: 10.15.1
  UV_VERSION: 0.9.7
  DOCKERHUB_IMAGE: docker.io/colinleefish/dsh-image
  ACR_IMAGE: registry.cn-beijing.aliyuncs.com/colinleefish/dsh-image
  PLATFORMS: linux/amd64

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency
        run: make version-check

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#image-v}"
          else
            version="${IMAGE_VERSION}"
          fi
          if [[ "${version}" != "${IMAGE_VERSION}" ]]; then
            echo "tag ${version} does not match Makefile/IMAGE_VERSION ${IMAGE_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login Aliyun ACR (beijing)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Refuse overwrite if tag exists on Docker Hub
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "refusing to overwrite existing Docker Hub tag: ${DOCKERHUB_IMAGE}:${VERSION}" >&2
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.ACR_IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            DSH_VERSION=${{ env.DSH_VERSION }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
            NODE_IMAGE=docker.io/library/node:24-trixie
            NPM_REGISTRY=https://registry.npmmirror.com
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/

      - name: Inspect published manifests
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${ACR_IMAGE}:${VERSION}"
