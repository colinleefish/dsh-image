name: Publish image

on:
  workflow_dispatch:
  push:
    tags:
      - "image-v*"

permissions:
  contents: write

env:
  DSH_VERSION: 0.2.2-rc.1
  IMAGE_VERSION: 0.2.2-rc.1-r4
  PNPM_VERSION: 10.15.1
  UV_VERSION: 0.9.7
  DOCKERHUB_IMAGE: docker.io/colinleefish/dsh-image
  ACR_IMAGE: registry.cn-beijing.aliyuncs.com/colinleefish/dsh-image
  PLATFORMS: linux/amd64

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version consistency
        run: make version-check

      - name: Resolve tag
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#image-v}"
          else
            version="${IMAGE_VERSION}"
          fi
          if [[ "${version}" != "${IMAGE_VERSION}" ]]; then
            echo "tag ${version} does not match Makefile/IMAGE_VERSION ${IMAGE_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "git_tag=image-v${version}" >>"${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login Aliyun ACR (beijing personal)
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Check existing image tags
        id: images
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          hub=false
          acr=false
          if docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            hub=true
          fi
          if docker buildx imagetools inspect "${ACR_IMAGE}:${VERSION}" >/dev/null 2>&1; then
            acr=true
          fi
          echo "hub_exists=${hub}" >>"${GITHUB_OUTPUT}"
          echo "acr_exists=${acr}" >>"${GITHUB_OUTPUT}"
          if [[ "${hub}" == true && "${acr}" == true ]]; then
            echo "build=false" >>"${GITHUB_OUTPUT}"
            echo "Both registry tags already exist; skip rebuild"
          elif [[ "${hub}" == true || "${acr}" == true ]]; then
            echo "Only one registry has ${VERSION}; refusing partial republish" >&2
            exit 1
          else
            echo "build=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Build and push both registries
        if: steps.images.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Personal ACR rejects OCI attestations (vnd.oci.empty.v1+json).
          provenance: false
          sbom: false
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.ACR_IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            DSH_VERSION=${{ env.DSH_VERSION }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
            NODE_IMAGE=docker.io/library/node:24-trixie
            NPM_REGISTRY=https://registry.npmmirror.com
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/

      - name: Collect digests and write release notes
        id: release_files
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DSH_VERSION: ${{ env.DSH_VERSION }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          ACR_IMAGE: ${{ env.ACR_IMAGE }}
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/{print $2; exit}'
          }
          hub_digest="$(digest_of "${DOCKERHUB_IMAGE}:${VERSION}")"
          acr_digest="$(digest_of "${ACR_IMAGE}:${VERSION}")"
          if [[ -z "${hub_digest}" || -z "${acr_digest}" ]]; then
            echo "missing digest(s): hub=${hub_digest:-empty} acr=${acr_digest:-empty}" >&2
            exit 1
          fi
          {
            echo "${hub_digest}  ${DOCKERHUB_IMAGE}:${VERSION}"
            echo "${acr_digest}  ${ACR_IMAGE}:${VERSION}"
          } >sha256sums.txt

          cat >release-notes.md <<EOF
          ## dsh-image ${VERSION}

          | Pin | Value |
          | --- | --- |
          | \`DSH_VERSION\` | \`${DSH_VERSION}\` (\`@deepseek-ai/dsh\`) |
          | \`IMAGE_VERSION\` | \`${VERSION}\` |

          ### Pull

          \`\`\`bash
          # Aliyun ACR (Beijing, preferred in China)
          docker pull ${ACR_IMAGE}:${VERSION}

          # Docker Hub
          docker pull ${DOCKERHUB_IMAGE}:${VERSION}
          \`\`\`

          ### Digests

          See attached \`sha256sums.txt\`.

          | Registry | Digest |
          | --- | --- |
          | Docker Hub | \`${hub_digest}\` |
          | Aliyun ACR | \`${acr_digest}\` |
          EOF
          sed -i 's/^          //' release-notes.md
          echo "hub_digest=${hub_digest}" >>"${GITHUB_OUTPUT}"
          echo "acr_digest=${acr_digest}" >>"${GITHUB_OUTPUT}"
          cat sha256sums.txt
          cat release-notes.md

      - name: Ensure git tags
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_TAG: ${{ steps.meta.outputs.git_tag }}
          DSH_VERSION: ${{ env.DSH_VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ensure_tag() {
            local tag="$1"
            local msg="$2"
            if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
              echo "tag ${tag} already exists"
            else
              git tag -a "${tag}" -m "${msg}"
              git push origin "refs/tags/${tag}"
            fi
          }
          ensure_tag "${GIT_TAG}" "dsh-image ${VERSION}"
          ensure_tag "dsh-v${DSH_VERSION}" "upstream @deepseek-ai/dsh ${DSH_VERSION} (image ${VERSION})"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_TAG: ${{ steps.meta.outputs.git_tag }}
        run: |
          set -euo pipefail
          if gh release view "${GIT_TAG}" >/dev/null 2>&1; then
            gh release upload "${GIT_TAG}" sha256sums.txt --clobber
            gh release edit "${GIT_TAG}" --notes-file release-notes.md
          else
            gh release create "${GIT_TAG}" \
              --title "dsh-image ${VERSION}" \
              --notes-file release-notes.md \
              sha256sums.txt
          fi
          gh release view "${GIT_TAG}" --json url,tagName,assets -q .
