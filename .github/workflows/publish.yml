# Look at upstream dsh-v* tags, publish the next newer image from main, record it.
# Does not follow npm dist-tags (latest/next). Does not create git tags or GitHub Releases.
name: Publish image

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Publish this Harness version (must exist as upstream dsh-v*)
        type: string
        required: false
        default: ''
      force:
        description: Rebuild even if this version is already in IMAGES.md
        type: boolean
        required: false
        default: false
      dry_run:
        description: Only print the plan
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: publish-dsh-image
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  TAG_SUFFIX_PATTERN: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
  DOCKERHUB_IMAGE: docker.io/colinleefish/dsh-image
  ACR_IMAGE: registry.cn-beijing.aliyuncs.com/colinleefish/dsh-image
  PLATFORMS: linux/amd64

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Load pins from Makefile
        run: |
          set -euo pipefail
          {
            echo "DSH_VERSION=$(grep -E '^DSH_VERSION \?=' Makefile | sed 's/^DSH_VERSION ?= //')"
            echo "PNPM_VERSION=$(grep -E '^PNPM_VERSION \?=' Makefile | sed 's/^PNPM_VERSION ?= //')"
            echo "UV_VERSION=$(grep -E '^UV_VERSION \?=' Makefile | sed 's/^UV_VERSION ?= //')"
          } >>"${GITHUB_ENV}"

      - name: Plan
        id: plan
        env:
          FORCE_VERSION: ${{ inputs.version }}
          FORCE_REBUILD: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/dsh-publish"
          mkdir -p "${tmp}"
          gh api "repos/${UPSTREAM_REPO}/tags" --paginate -q '.[].name' >"${tmp}/upstream.txt"
          if [[ ! -s "${tmp}/upstream.txt" ]]; then
            echo "upstream tag list is empty" >&2
            exit 1
          fi
          dry="false"
          rebuild="false"
          if [[ "${DRY_RUN}" == "true" ]]; then
            dry="true"
          fi
          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            rebuild="true"
          fi
          python3 scripts/dsh_catalog.py plan \
            --upstream-file "${tmp}/upstream.txt" \
            --main-version "${DSH_VERSION}" \
            --force "${FORCE_VERSION}" \
            --force-rebuild "${rebuild}" \
            --pattern "${TAG_SUFFIX_PATTERN}" \
            --dry-run "${dry}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Stop
        if: steps.plan.outputs.action == 'none' || steps.plan.outputs.dry_run == 'true'
        run: echo "${{ steps.plan.outputs.reason }}"

      - name: Bump pin
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true' && steps.plan.outputs.bump_pin == 'true'
        env:
          SYNC_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/bump-dsh-version.sh
          ./scripts/bump-dsh-version.sh "${SYNC_VERSION}"

      - name: Version consistency
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true'
        run: make version-check

      - name: Set up QEMU
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login Aliyun ACR (beijing personal)
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Inspect existing image
        id: existing
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true' && github.event.inputs.force != 'true'
        env:
          SYNC_VERSION: ${{ steps.plan.outputs.version }}
        run: bash scripts/inspect-dsh-image.sh

      - name: Build and push both registries
        id: build
        if: >
          steps.plan.outputs.action != 'none' &&
          steps.plan.outputs.dry_run != 'true' &&
          (github.event.inputs.force == 'true' || steps.existing.outputs.found != 'true')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          platforms: ${{ env.PLATFORMS }}
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:${{ steps.plan.outputs.version }}
            ${{ env.ACR_IMAGE }}:${{ steps.plan.outputs.version }}
          build-args: |
            DSH_VERSION=${{ steps.plan.outputs.version }}
            IMAGE_VERSION=${{ steps.plan.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            UV_VERSION=${{ env.UV_VERSION }}
            NODE_IMAGE=docker.io/library/node:24-trixie
            NPM_REGISTRY=https://registry.npmmirror.com
            PIP_INDEX_URL=https://mirrors.aliyun.com/pypi/simple/

      - name: Collect digests
        id: digests
        if: steps.build.outcome == 'success'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect "$1" | awk '/^Digest:/{print $2; exit}'
          }
          hub_digest="$(digest_of "${DOCKERHUB_IMAGE}:${VERSION}")"
          acr_digest="$(digest_of "${ACR_IMAGE}:${VERSION}")"
          if [[ -z "${hub_digest}" || -z "${acr_digest}" ]]; then
            echo "missing digest(s): hub=${hub_digest:-empty} acr=${acr_digest:-empty}" >&2
            exit 1
          fi
          {
            echo "hub_digest=${hub_digest}"
            echo "acr_digest=${acr_digest}"
          } >>"${GITHUB_OUTPUT}"
          echo "${hub_digest}  ${DOCKERHUB_IMAGE}:${VERSION}"
          echo "${acr_digest}  ${ACR_IMAGE}:${VERSION}"

      - name: Record published image
        if: >
          steps.plan.outputs.action != 'none' &&
          steps.plan.outputs.dry_run != 'true' &&
          (steps.existing.outputs.found == 'true' || steps.build.outcome == 'success')
        env:
          SYNC_VERSION: ${{ steps.plan.outputs.version }}
          HUB_DIGEST: ${{ steps.existing.outputs.hub_digest || steps.digests.outputs.hub_digest }}
          ACR_DIGEST: ${{ steps.existing.outputs.acr_digest || steps.digests.outputs.acr_digest }}
        run: bash scripts/record-dsh-publish.sh

      - name: Record skipped version
        if: failure() && steps.build.conclusion == 'failure'
        env:
          SYNC_VERSION: ${{ steps.plan.outputs.version }}
        run: bash scripts/record-dsh-skip.sh "image build failed"
