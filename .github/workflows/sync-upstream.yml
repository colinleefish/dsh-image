# Watch deepseek-harness release tags (dsh-v*).
# main only moves forward. Older tags are published from a detached commit.
# A missing tag or GitHub Release is retried even when the pin already matches.
# Does not follow npm dist-tags (latest/next).
name: Sync upstream dsh release

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Force-sync one Harness version (e.g. 0.2.2-rc.3); must exist as dsh-v* upstream
        type: string
        required: false
        default: ''
      dry_run:
        description: Only print what would happen
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-dsh
  cancel-in-progress: false

env:
  UPSTREAM_REPO: deepseek-ai/deepseek-harness
  # Semver after stripping dsh-v (alpha/rc/pre-releases included). Empty = no filter.
  TAG_SUFFIX_PATTERN: '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan sync
        id: plan
        env:
          FORCE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          TAG_SUFFIX_PATTERN: ${{ env.TAG_SUFFIX_PATTERN }}
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/dsh-sync"
          mkdir -p "${tmp}"
          gh api "repos/${UPSTREAM_REPO}/tags" --paginate -q '.[].name' >"${tmp}/upstream.txt"
          if [[ ! -s "${tmp}/upstream.txt" ]]; then
            echo "upstream tag list is empty" >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/tags" --paginate -q '.[].name' >"${tmp}/ours.txt"
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate -q '.[].tag_name' >"${tmp}/releases.txt"
          gh run list --workflow publish.yml --limit 100 \
            --json headBranch,conclusion,status,createdAt >"${tmp}/runs.json"
          main_version="$(grep -E '^DSH_VERSION \?=' Makefile | sed 's/^DSH_VERSION ?= //')"
          dry="false"
          if [[ "${DRY_RUN}" == "true" ]]; then
            dry="true"
          fi
          python3 scripts/plan_dsh_sync.py \
            --upstream-file "${tmp}/upstream.txt" \
            --ours-file "${tmp}/ours.txt" \
            --releases-file "${tmp}/releases.txt" \
            --runs-json "${tmp}/runs.json" \
            --main-version "${main_version}" \
            --force "${FORCE_VERSION}" \
            --pattern "${TAG_SUFFIX_PATTERN}" \
            --cooldown-hours 12 \
            --dry-run "${dry}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Apply sync plan
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.dry_run != 'true'
        env:
          SYNC_ACTION: ${{ steps.plan.outputs.action }}
          SYNC_VERSION: ${{ steps.plan.outputs.version }}
          SYNC_COMMIT_MODE: ${{ steps.plan.outputs.commit_mode }}
          SYNC_CREATE_TAG: ${{ steps.plan.outputs.create_tag }}
          SYNC_DISPATCH_PUBLISH: ${{ steps.plan.outputs.dispatch_publish }}
        run: bash scripts/apply-dsh-sync.sh
